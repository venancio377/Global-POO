# Configuración de conexión a SQL Server (editar según tu equipo).
# Instancia con puerto TCP 1433 (la que usa este proyecto):
#   jdbc:sqlserver://localhost:1433;databaseName=InventarioUTNG;encrypt=true;trustServerCertificate=true
# Instancia con nombre (sin puerto fijo):
#   jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=InventarioUTNG;encrypt=true;trustServerCertificate=true
# Las variables de entorno DB_URL, DB_USUARIO y DB_PASSWORD, si existen, tienen prioridad.
# No subas tu contraseña real a GitHub.
db.url=jdbc:sqlserver://localhost:1433;databaseName=InventarioUTNG;encrypt=true;trustServerCertificate=true
db.usuario=inventario_app
db.password=Admin1234
